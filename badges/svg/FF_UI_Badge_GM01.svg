<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes ff_sheen {
        0% { transform: translate(-140px, 140px) rotate(45deg); }
        100% { transform: translate(140px, -140px) rotate(45deg); }
      }
      @keyframes ff_star_twinkle {
        0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.35; }
        50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
      }
      @keyframes ff_bone_pulse {
        0% { transform: scale(0.88); opacity: 0.75; }
        100% { transform: scale(1.12); opacity: 1; }
      }
      .sheen-beam {
        animation: ff_sheen 2.4s infinite linear;
      }
      .star-anim {
        transform-origin: center;
        animation: ff_star_twinkle 1.8s infinite ease-in-out;
      }
      .bone-spot {
        transform-origin: center;
        animation: ff_bone_pulse 2s infinite alternate ease-in-out;
      }
    </style>
    <mask id="badgeMask">
      <image href="data:image/png;base64," width="200" height="200" />
    </mask>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="35%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 100% Transparent Background (Zero solid rects) -->

  <!-- Stars Layer Behind/Around -->
  <g id="starsLayer">
    
  </g>

  <!-- Base Badge Image (100% Transparent PNG) -->
  <image href="data:image/png;base64," width="200" height="200" />
  
  <!-- Masked Continuous Metallic Sheen -->
  <g mask="url(#badgeMask)">
    <rect class="sheen-beam" x="-60" y="-60" width="320" height="70" fill="url(#sheenGrad)" />
  </g>

  <!-- Multi-Bone Focal Accent Lighting (Masked Inside Badge Metal Texture) -->
  <g mask="url(#badgeMask)">
    
      <circle class="bone-spot" cx="100.0" cy="28.0" r="18.0" fill="#FFD700" opacity="0.85" style="mix-blend-mode: screen; filter: blur(2px);" />
      <circle cx="100.0" cy="28.0" r="5.0" fill="#FFFFFF" opacity="0.95" />
      <circle class="bone-spot" cx="100.0" cy="104.0" r="21.6" fill="#FFFFFF" opacity="0.85" style="mix-blend-mode: screen; filter: blur(2px);" />
      <circle cx="100.0" cy="104.0" r="6.0" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>